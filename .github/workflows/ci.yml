name: CI/CD

# webapp's default branch is main, not dev - unlike the twelve service repos.
# The deploy is still gated to the dev tag below, so a main push publishes
# :latest and stops there, exactly as it does for a service pushed to main.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # homecrew:standards:ci-secret-scan:start
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            dir /repo --redact --no-banner --log-level error
      # homecrew:standards:ci-secret-scan:end

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # No `cache: npm` - that step requires a lockfile and fails the job
          # without one. Add it together with package-lock.json.
          registry-url: https://registry.npmjs.org

      # `npm install`, not `npm ci`, only until a lockfile is committed - npm ci
      # requires package-lock.json and exits non-zero without it. Builds are not
      # reproducible until that changes; see README.md.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      # Type-aware lint, so it needs the TypeScript project to resolve - which
      # is why it runs after install rather than as a standalone job.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker image tag
        id: meta
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      # The image builds the bundle itself, so there is no prior compile step
      # here - unlike a service repo, which packages a jar first.
      - name: Build Docker image
        run: |
          docker build \
            -t mthanuj/homecrew-webapp:${{ steps.meta.outputs.tag }} \
            -t mthanuj/homecrew-webapp:sha-${GITHUB_SHA::7} \
            .

      - name: Push Docker image
        run: |
          docker push mthanuj/homecrew-webapp:${{ steps.meta.outputs.tag }}
          docker push mthanuj/homecrew-webapp:sha-${GITHUB_SHA::7}

      - name: Trigger infrastructure deployment
        # Only dev deploys. deploy.yml rejects any other tag, and a push
        # to main publishes :latest with nowhere to send it.
        if: steps.meta.outputs.tag == 'dev'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e

          echo "Triggering infrastructure deployment..."

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/homecrews/home-crew-infrastructure/dispatches \
            -d '{
              "event_type": "service-image-updated",
              "client_payload": {
                "service": "webapp",
                "image": "mthanuj/homecrew-webapp",
                "tag": "${{ steps.meta.outputs.tag }}",
                "sha": "${{ github.sha }}"
              }
            }'
