server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The whole reason this file exists. Angular routes exist only in the
    # browser, so a request for /bookings has no file behind it - without this,
    # nginx answers 404 and a deep link or a refresh breaks the app while the
    # home page works fine.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames are immutable, so they can be cached hard. index.html
    # must NOT be, or a browser keeps loading the old bundle after a deploy.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
